<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WORD CHAIN α</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;background:linear-gradient(160deg,#111a3c,#253a77);font-family:system-ui,sans-serif;color:white;touch-action:none}.wrap{max-width:520px;margin:auto;padding:12px 14px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;justify-content:space-between}h1{margin:4px 0;font-size:34px;letter-spacing:2px}.sub{opacity:.75;font-size:13px}.stats{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.stat{background:#ffffff18;border-radius:14px;padding:12px;flex:1;text-align:center}.stat b{display:block;font-size:28px}.stat small{opacity:.7}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#111a3b;border-radius:18px;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none;width:min(100%,calc(100dvh - 335px));align-self:center}.tile{aspect-ratio:1;border-radius:13px;background:linear-gradient(#fff,#d7e4ff);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8vw,43px);box-shadow:0 3px 0 #8ba4c6;transition:transform .1s}.tile.selected{background:#ffe174;transform:scale(.9);box-shadow:0 0 0 3px #ffae2d}.word{text-align:center;min-height:52px;height:clamp(52px,10dvh,90px);display:flex;flex-direction:column;align-items:center;justify-content:center}.word strong{font-size:45px;color:#ffdd68;text-shadow:0 3px 8px #0006}.word span{font-size:14px;opacity:.8}button{border:0;border-radius:15px;background:linear-gradient(90deg,#ffc54c,#ff9049);color:#2a2350;padding:16px;font-size:23px;font-weight:900;width:100%;cursor:pointer}.overlay{position:fixed;inset:0;background:#050a1bbd;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(440px,100%);background:#2c3e76;border:2px solid #6d82c6;border-radius:26px;padding:25px;text-align:center;box-shadow:0 20px 70px #0007}.modal h2{font-size:32px}.modal p{line-height:1.9}.hidden{display:none}.tip{font-size:12px;opacity:.75;text-align:center;margin:4px 0}
@media(max-height:720px){h1{font-size:25px}.stat{padding:6px}.stat b{font-size:20px}.tile{font-size:clamp(19px,6vw,36px)}button{padding:10px;font-size:17px}.word strong{font-size:32px}.sub{font-size:11px}} </style></head><body><main class="wrap"><h1>🐶 WORD CHAIN</h1><div class="sub">つなげて、消して、英語がひびく！</div><div class="stats"><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="time">60</b><small>TIME</small></div><div class="stat"><b id="best">0</b><small>BEST CHAIN</small></div></div><div class="word"><strong id="word">READY?</strong><span id="hint">同じ絵を3個以上なぞろう</span></div><div id="board" class="board"></div><p class="tip">隣り合う同じ絵を3つ以上なぞって指を離すと消えるよ</p><button id="testvoice" style="margin-bottom:9px">🔈 発音テスト：DOG</button><button id="sound">🔊 音声 ON</button><p id="voice-status" class="tip" aria-live="polite">発音テストを押して音声を確認できます</p></main><div class="overlay" id="overlay"><div class="modal"><h2>🐶 WORD CHAIN</h2><p>英語のテストはありません。<br>同じ絵を3個以上つなげるだけ！<br>60秒でどこまでスコアを伸ばせる？</p><button id="play">▶ PLAY!</button></div></div>
<script>
(()=>{'use strict';
const words=[['🐶','DOG'],['🐱','CAT'],['🐮','COW'],['🍎','APPLE'],['🍌','BANANA'],['🚗','CAR']];
const N=6, board=document.getElementById('board'), scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),wordEl=document.getElementById('word'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay');
let cells=[],path=[],active=false,playing=false,score=0,best=0,remaining=60,timer=null,sound=true;
const rand=()=>Math.floor(Math.random()*words.length);
function render(){board.innerHTML='';cells.forEach((v,i)=>{let d=document.createElement('div');d.className='tile'+(path.includes(i)?' selected':'');d.textContent=words[v][0];d.dataset.i=i;board.appendChild(d)})}
function newBoard(){cells=Array.from({length:N*N},rand);render()}
function adjacent(a,b){return Math.abs(Math.floor(a/N)-Math.floor(b/N))<=1&&Math.abs(a%N-b%N)<=1&&a!==b}
function select(i){if(!playing||i<0||i>=cells.length)return;if(!active){active=true;path=[i]}else{let last=path[path.length-1];if(path.length>1&&i===path[path.length-2])path.pop();else if(!path.includes(i)&&adjacent(last,i)&&cells[last]===cells[i])path.push(i)}render()}
function atPoint(e){let el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.tile')}
function down(e){let tile=e.target.closest('.tile');if(!tile||!playing)return;e.preventDefault();select(Number(tile.dataset.i));board.setPointerCapture?.(e.pointerId)}
function move(e){if(!active)return;e.preventDefault();let tile=atPoint(e);if(tile)select(Number(tile.dataset.i))}
function say(s,force=false){const status=document.getElementById('voice-status');if(!force&&!sound)return;if(!('speechSynthesis'in window)){status.textContent='このブラウザは音声合成に対応していません';return}try{const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(s.toLowerCase());u.lang='en-US';u.rate=.85;u.volume=1;const voices=synth.getVoices();const en=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(en)u.voice=en;u.onstart=()=>{status.textContent='再生中：'+s};u.onend=()=>{status.textContent='再生完了：'+s};u.onerror=e=>{status.textContent='音声エラー：'+e.error};status.textContent='再生要求：'+s+'（英語音声 '+voices.filter(v=>v.lang.startsWith('en')).length+'種類）';synth.speak(u)}catch(e){status.textContent='音声例外：'+e.message}}
function finish(){if(!active)return;active=false;if(path.length>=3){let type=cells[path[0]],len=path.length;score+=len*len*10;best=Math.max(best,len);scoreEl.textContent=score;bestEl.textContent=best;wordEl.textContent=words[type][1]+'!';hint.textContent=len+' CHAIN!';say(words[type][1]);const removed=new Set(path);for(let x=0;x<N;x++){let col=[];for(let y=N-1;y>=0;y--){let i=y*N+x;if(!removed.has(i))col.push(cells[i])}while(col.length<N)col.push(rand());for(let y=N-1;y>=0;y--)cells[y*N+x]=col[N-1-y]}}path=[];render()}
function end(){playing=false;clearInterval(timer);overlay.classList.remove('hidden');overlay.querySelector('h2').textContent='TIME UP!';overlay.querySelector('p').innerHTML='SCORE: '+score+'<br>BEST CHAIN: '+best+'<br>もう一回遊ぶ？';document.getElementById('play').textContent='▶ AGAIN!'}
function start(){score=0;best=0;remaining=60;playing=true;active=false;path=[];scoreEl.textContent=0;bestEl.textContent=0;timeEl.textContent=60;wordEl.textContent='GO!';hint.textContent='同じ絵を3個以上つなげよう';newBoard();overlay.classList.add('hidden');clearInterval(timer);timer=setInterval(()=>{remaining--;timeEl.textContent=remaining;if(remaining<=0)end()},1000)}
document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});board.addEventListener('pointerdown',down);board.addEventListener('pointermove',move);window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);document.getElementById('play').addEventListener('click',start);document.getElementById('testvoice').addEventListener('click',()=>say('DOG',true));document.getElementById('sound').addEventListener('click',()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊 音声 ON':'🔇 音声 OFF'});newBoard();
})();
</script></body></html>
