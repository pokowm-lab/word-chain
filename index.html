    <div class="bottom">発音を聞いて、英単語を自然に覚えよう</div>
  </main>
  <div class="overlay" id="overlay"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">🐶 WORD CHAIN</h2><div id="modalText" class="modal-copy">同じ絵を3つ以上つなげて消そう！<br>60秒でスコアを伸ばし、英単語を解放しよう。</div><div class="modal-actions"><button class="wide" id="modalPrimary">▶ PLAY!</button><button class="wide secondary" id="modalSecondary">📖 ことば・編成</button></div></section></div>

  <script src="./survival-logic.js"></script>
  <script>
  (()=>{'use strict';
    const WORDS=WordChainWords.words, BY_ID=WordChainWords.byId, Survival=WordChainSurvival, Collection=WordChainCollection, CollectionConfig=WordChainCollectionConfig, Cosmetics=WordChainCosmetics;
    const ACHIEVEMENTS=[['firstPlay','初プレイ','はじめて遊ぶ'],['chain8','8 CHAIN!','1回で8個以上消す'],['firstFever','初フィーバー','フィーバーを発動する'],['score5000','SCORE 5,000','1プレイで5,000点を獲得'],['plays10','10 PLAYS','累計10回プレイする'],['total50000','50,000 POINTS','累計50,000点を獲得']];
    const KEY='word-chain-save',SURVIVAL_KEY='word-chain-survival-v1';const N=6;const BASE=['dog','cat','cow','apple','banana','car'];
    const $=id=>document.getElementById(id);const board=$('board'),overlay=$('overlay');
    let data=loadData(),cells=[],path=[],active=false,playing=false,busy=false,soundOn=true,score=0,bestChain=0,remaining=60,feverProgress=0,feverUntil=0,gameEnds=0,tickHandle=null,pauseStartedAt=null,audioCtx=null,voices=[],feverParticleTimer=null,bgm=null,bgmMode=null,pendingVoices=0,sessionStartXP=0,normalSessionId=null,gachaBusy=false,gachaTimer=null;
    let mode='classic',run=null,stageScore=0,lastCategory=null,rewardOffers=[],exchangePick=null;
    let survivalRecord=loadSurvivalRecord();
    function freshData(){return{version:3,schemaVersion:3,highScore:0,totalScore:0,totalUnlockScore:0,plays:0,totalCleared:0,achievements:[],unlocked:BASE.slice(),deck:BASE.slice(),coins:0,lifetimeCoinsEarned:0,lifetimeCosmeticPulls:0,vocabularyXP:0,ownedWords:Object.fromEntries(BASE.map(id=>[id,1])),firstClearedWords:[],newWords:[],lifetimeWordClears:0,claimedStageXP:[],claimedSurvivalRuns:[],claimedNormalUnlockRuns:[],claimedSurvivalUnlockRuns:[],cosmetics:{owned:['classic'],equipped:{theme:'classic',effect:null,title:null}},newCosmetics:[]}}
    function loadData(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){d=null}const base=freshData();if(!d||typeof d!=='object'||Array.isArray(d))return base;
      const num=(v,min=0)=>Number.isFinite(v)&&v>=min?Math.floor(v):0;
      base.highScore=num(d.highScore??d.bestScore);base.totalScore=num(d.totalScore??d.lifetimeScore);base.plays=num(d.plays??d.playCount);base.totalCleared=num(d.totalCleared??d.clearedCount);
      base.achievements=Array.isArray(d.achievements)?ACHIEVEMENTS.map(a=>a[0]).filter(id=>d.achievements.includes(id)):[];
      base.unlocked=Array.isArray(d.unlocked)?[...new Set([...BASE,...d.unlocked.filter(id=>WORDS.some(w=>w.id===id))])]:BASE.slice();
      base.deck=Array.isArray(d.deck)?[...new Set(d.deck.filter(id=>base.unlocked.includes(id)))].slice(0,6):BASE.slice();
      for(const id of BASE)if(base.deck.length<6&&!base.deck.includes(id))base.deck.push(id);if(base.deck.length>6)base.deck=base.deck.slice(0,6);
      let profile=Collection.normalizeProfile({...base,...d,highScore:base.highScore,totalScore:base.totalScore,totalUnlockScore:Number.isFinite(d.totalUnlockScore)?num(d.totalUnlockScore):base.totalScore,plays:base.plays,totalCleared:base.totalCleared,unlocked:base.unlocked,deck:base.deck,achievements:base.achievements},WORDS,BASE);
      profile.version=3;profile.deck=base.deck;profile=Collection.syncScoreUnlocks(profile,WORDS).profile;return profile;
    }
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data));refreshStats();return true}catch(_){toast('保存できませんでした。端末の空き容量を確認してください','');refreshStats();return false}}
    function loadSurvivalRecord(){try{return Survival.loadRecord(localStorage.getItem(SURVIVAL_KEY),WORDS)}catch(_){return Survival.loadRecord(null,WORDS)}}
    function saveSurvival(){try{localStorage.setItem(SURVIVAL_KEY,JSON.stringify(survivalRecord))}catch(_){toast('サバイバル記録を保存できませんでした')}}
    function currentDeck(){return mode==='survival'&&run?run.deck:data.deck}
    function refreshStats(){ $('best').textContent=mode==='survival'&&run?fmt(survivalRecord.bestRunScore):data.highScore.toLocaleString();$('wordCount').textContent=data.unlocked.length+'/100'; }
    const wordById=id=>WORDS.find(w=>w.id===id)||WORDS[0];
    function rand(){return Math.floor(Math.random()*currentDeck().length)}
    function makeTile(v,i,extra=''){const d=document.createElement('div');d.className='tile '+extra;d.dataset.i=i;d.setAttribute('role','gridcell');const w=wordById(currentDeck()[v]);if(w.image){const im=document.createElement('img');im.src=w.image;im.alt=w.name;im.draggable=false;im.style.cssText='width:72%;height:72%;object-fit:contain';d.append(im)}else d.textContent=w.emoji;return d}
    function render(extra=new Set()){board.replaceChildren();cells.forEach((v,i)=>board.append(makeTile(v,i,extra.has(i)?'drop-in':'')));drawLinks()}
    const adjacent=WordChainLogic.adjacent;
    function hasMove(arr=cells){return WordChainLogic.hasMove(arr,N)}
    function shuffleEnsure(){for(let tries=0;tries<300;tries++){for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}if(hasMove())return}cells[0]=0;cells[1]=0;cells[2]=0}
    function newBoard(){cells=Array.from({length:N*N},rand);if(!hasMove())shuffleEnsure();render()}
    function cellCenter(i){const t=board.querySelector('[data-i="'+i+'"]');if(!t)return null;const b=board.getBoundingClientRect(),r=t.getBoundingClientRect();return{x:r.left-b.left+r.width/2,y:r.top-b.top+r.height/2}}
    function drawLinks(){const poly=$('links').querySelector('polyline');$('links').setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);const pts=path.map(cellCenter).filter(Boolean).map(p=>p.x+','+p.y).join(' ');poly.setAttribute('points',pts)}
    function select(i){if(!playing||busy||i<0||i>=cells.length)return;if(!active){active=true;path=[i];playTone('select')}else{const last=path[path.length-1];if(path.length>1&&i===path[path.length-2])path.pop();else if(!path.includes(i)&&adjacent(last,i)&&cells[last]===cells[i])path.push(i)}render()}
    function atPoint(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.tile')}
    function down(e){const tile=e.target.closest('.tile');if(!tile||!playing||busy)return;e.preventDefault();board.setPointerCapture?.(e.pointerId);select(Number(tile.dataset.i))}
    function move(e){if(!active)return;e.preventDefault();const tile=atPoint(e);if(tile)select(Number(tile.dataset.i))}
    const scoreMultiplier=WordChainLogic.multiplier;
    function fmt(n){return Math.floor(n).toLocaleString()}
    function refreshVoices(){if('speechSynthesis'in window)voices=window.speechSynthesis.getVoices()||[]}
    function musicElement(){if(!bgm){bgm=new Audio();bgm.loop=true;bgm.preload='auto';bgm.volume=.10;bgm.playsInline=true}return bgm}
    function playBgm(which){if(!soundOn)return;const audio=musicElement(),src=which==='survival'?'./assets/bgm-survival.mp3':'./assets/bgm-normal.mp3';if(bgmMode!==which||!audio.src.endsWith(src.slice(1))){audio.pause();audio.src=src;audio.currentTime=0;audio.load();bgmMode=which}audio.play().catch(()=>{})}
    function stopBgm(){if(bgm)bgm.pause();bgmMode=null}
    function finishVoice(){pendingVoices=Math.max(0,pendingVoices-1)}
    function say(word,onDone){const status=$('hint');if(!('speechSynthesis'in window)){status.textContent=word.name+'!';onDone?.();return}try{const s=window.speechSynthesis;refreshVoices();const u=new SpeechSynthesisUtterance(word.pron.toLowerCase());u.lang='en-US';u.rate=.84;u.volume=1;const en=voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(en)u.voice=en;pendingVoices++;let settled=false;const settle=()=>{if(settled)return;settled=true;finishVoice()};u.onstart=()=>{status.textContent='Listen: '+word.name};u.onend=()=>{status.textContent=word.name+'!';settle();onDone?.()};u.onerror=()=>{status.textContent=word.name+'!';settle();onDone?.()};s.speak(u)}catch(_){status.textContent=word.name+'!';finishVoice();onDone?.()}}
    function primeSpeech(){if(!('speechSynthesis'in window))return;try{refreshVoices();say({name:'GO',pron:'go'})}catch(_){}}
    function getAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(_){return null}}
    function playTone(kind){if(!soundOn||pendingVoices)return;const c=getAudio();if(!c)return;const now=c.currentTime;const notes=kind==='fever'?[523,659,784,1047]:kind==='clear'?[660,880]:kind==='select'?[480]:[740];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==='fever'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(kind==='select'?.035:.06,now+i*.07+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.14);o.connect(g).connect(c.destination);o.start(now+i*.07);o.stop(now+i*.07+.15)})}
    function toast(message,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=message;$('toasts').append(t);setTimeout(()=>t.remove(),3900)}
    function award(id){if(data.achievements.includes(id))return;data.achievements.push(id);const a=ACHIEVEMENTS.find(x=>x[0]===id);if(a)toast('🏅 実績解除：'+a[1],'achievement');save()}
    function spawnFeverParticles(count=4){const layer=$('feverCelebration');const colors=['#ffd982','#f7a7ce','#a9e6ed','#c6b1f2'];for(let i=0;i<count;i++){const p=document.createElement('i');p.className='fever-particle';const side=Math.random()<.5;const x=side?3+Math.random()*18:79+Math.random()*18;p.style.setProperty('--x',x+'vw');p.style.setProperty('--size',(9+Math.random()*13)+'px');p.style.setProperty('--color',colors[Math.floor(Math.random()*colors.length)]);p.style.setProperty('--duration',(2.5+Math.random()*1.1)+'s');p.style.setProperty('--drift',(-18+Math.random()*36)+'px');p.style.animationDelay=(Math.random()*.25)+'s';layer.append(p);setTimeout(()=>p.remove(),4200)}}
    function updateFeverUI(){const fever=feverUntil>Date.now();$('feverTitle').classList.toggle('hot',fever);$('feverTitle').textContent=fever?'🔥 FEVER!':'✨ FEVER CHARGE';$('feverCount').textContent=fever?((Math.max(0,feverUntil-Date.now())/1000).toFixed(1)+' 秒'):feverProgress+' / 30';$('feverFill').style.width=fever?Math.max(0,Math.min(100,(feverUntil-Date.now())/10000*100))+'%':(feverProgress/30*100)+'%';document.body.classList.toggle('fevery',fever);if(fever&&!feverParticleTimer){spawnFeverParticles(10);feverParticleTimer=setInterval(()=>spawnFeverParticles(3),850)}else if(!fever&&feverParticleTimer){clearInterval(feverParticleTimer);feverParticleTimer=null}}
    function activateFever(){feverProgress=0;feverUntil=Date.now()+10000;award('firstFever');updateFeverUI();toast('🔥 FEVER TIME! 10秒間スコア2倍','unlock')}
    function showFloat(amount){const f=document.createElement('div');f.className='float-score';f.textContent='+'+fmt(amount);document.querySelector('.board-wrap').append(f);setTimeout(()=>f.remove(),900)}
    function scoreUpdate(n){$('score').textContent=fmt(n);if(score>data.highScore){data.highScore=score;$('best').textContent=fmt(score)}}
    function notifyLevel(beforeXP,afterXP){const before=Collection.levelForXP(beforeXP).level,after=Collection.levelForXP(afterXP).level;if(after>before)toast('VOCABULARY LEVEL UP!  Lv. '+before+' → Lv. '+after,'level-up')}
    function recordClearXP(word){const before=data.vocabularyXP,result=Collection.recordWordClear(data,word.id);data=result.profile;save();notifyLevel(before,data.vocabularyXP);return result.xp}
    function profileSummaryHTML(){const lv=Collection.levelForXP(data.vocabularyXP),owned=data.unlocked.length,title=Cosmetics.GACHA.find(x=>x.id===data.cosmetics.equipped.title)?.name;return '<div class="profile-summary"><div class="profile-tile">💰 COIN<b>'+fmt(data.coins)+'</b></div><div class="profile-tile">📚 Vocab Lv.<b>'+lv.level+'</b><small>'+fmt(lv.xpIntoLevel)+' / '+fmt(lv.xpToNext)+' XP to next</small><div class="meter profile-progress"><div class="meter-fill" style="width:'+(lv.progress*100)+'%"></div></div></div></div><div class="collection-title">'+owned+'/100 words · '+fmt(data.lifetimeWordClears)+' chain clears · '+data.firstClearedWords.length+' words cleared · '+fmt(data.lifetimeCoinsEarned)+' lifetime COIN · '+fmt(data.lifetimeCosmeticPulls)+' cosmetic pulls'+(title?'<div class="profile-title">TITLE · '+title+'</div>':'')+'</div>'}
    function applyCosmeticAppearance(){const equipped=data.cosmetics?.equipped||{};document.body.dataset.theme=equipped.theme||'classic';if(equipped.effect)document.body.dataset.effect=equipped.effect;else delete document.body.dataset.effect}
    function scoreUnlockHTML(items){if(!items?.length)return'';return '<h3>NEW WORD UNLOCKED!</h3><div class="score-unlock-list">'+items.map(w=>'<div class="score-unlock-row">'+w.icon+' <b>'+w.word+'</b> · '+w.meaning+' · '+w.category+'</div>').join('')+'</div>'}
    function finish(){if(!active)return;active=false;const selected=path.slice();path=[];if(selected.length<3){render();return}busy=true;const type=cells[selected[0]],len=selected.length,word=wordById(currentDeck()[type]),mult=scoreMultiplier(len),isFever=feverUntil>Date.now();let points;
      if(mode==='survival'&&run){const category=word.category,role=Survival.roleForDeck(run.deck,BY_ID),roleMult=Survival.roleMultiplier(role,category,lastCategory);points=Survival.scoreClear({count:len,fever:isFever,role:roleMult,globalStacks:run.upgrades.global,categoryStacks:run.upgrades.category[category]||0,chainStacks:run.upgrades.chain,categoryMatches:true});stageScore+=points;score+=points;data.totalCleared+=len;run.runScore+=points;lastCategory=category;survivalRecord.encountered=[...new Set([...survivalRecord.encountered,word.id])];run.encountered=[...new Set([...run.encountered,word.id])];run.stageScore=stageScore;survivalRecord.bestStage=Math.max(survivalRecord.bestStage,run.stage);survivalRecord.bestRunScore=Math.max(survivalRecord.bestRunScore,run.runScore);saveSurvival()}
      else{points=WordChainLogic.score(len,isFever);score+=points;data.totalScore+=points;data.totalCleared+=len;scoreUpdate();if(score>=5000)award('score5000')}
      recordClearXP(word);bestChain=Math.max(bestChain,len);$('score').textContent=fmt(mode==='survival'?stageScore:score);if(mode==='survival')paintRole();$('word').textContent=word.name;$('hint').textContent=len+' CHAIN × '+mult+(isFever?' × FEVER':'')+(mode==='survival'?' × ROLE/UPGRADE':'');$('combo').textContent=len>=10?'AMAZING!':len>=7?'GREAT!':len>=5?'NICE!':len+' CHAIN';$('combo').classList.toggle('show',len>=5);showFloat(points);if(mode==='classic'&&len>=8)award('chain8');const feverWas=isFever;let feverStarted=false;if(!feverWas){feverProgress+=len;if(feverProgress>=(mode==='survival'?Math.max(21,30-(run?.upgrades.fever||0)*3):30)){activateFever();feverStarted=true}}save();if(mode==='survival')saveSurvival();

    function showShop(){const body=profileSummaryHTML()+'<p class="progress-copy">盤面テーマをCOINで直接購入できます。購入後、EQUIPで切り替えます。</p><div class="cosmetic-list">'+Cosmetics.SHOP.map(item=>cosmeticCard(item,(owned,equipped,x)=>'<button '+(equipped?'disabled':'')+' data-shop="'+x.id+'">'+(equipped?'EQUIPPED':owned?'EQUIP':x.price===0?'FREE':'BUY · '+fmt(x.price))+'</button>')).join('')+'</div>';showModal({title:'🛍️ COSMETIC SHOP',body,primary:'ホームへ',secondary:'🎁 COSMETIC GACHA',action:showHome,secondaryAction:showCosmeticGacha});document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{const id=b.dataset.shop,before=data,result=before.cosmetics.owned.includes(id)?Cosmetics.equip(before,id):Cosmetics.buyTheme(before,id);if(!result.ok){toast(result.reason==='insufficient-coins'?'COINが足りません':'このテーマはすでに所持しています');return}data=result.profile;if(!save()){data=before;return}applyCosmeticAppearance();showShop()})}
    function showCosmeticGacha(){const pullable=Cosmetics.GACHA.filter(x=>!data.cosmetics.owned.includes(x.id)),prob=pullable.length?100/pullable.length:0;showModal({title:'🎁 COSMETIC GACHA',body:profileSummaryHTML()+'<p>1回 '+fmt(Cosmetics.GACHA_COST)+' COIN · 未所持アイテム '+pullable.length+' 種</p><p class="progress-copy">現在の排出率：未所持 '+(pullable.length?prob.toFixed(1):'0')+'%ずつ。重複排出なし。全6種入手後は停止します。</p><div class="gacha-rates">'+(pullable.length?pullable.map(item=>'<div><b>'+item.icon+'</b>'+item.name+'<br>'+(prob.toFixed(1))+'%</div>').join(''):'<div style="grid-column:1/-1">全6種類コンプリート！</div>')+'</div><div class="gacha-box"><div style="font-size:48px">🎁</div><b>OUTFIT COLLECTION</b></div>',primary:pullable.length?'🎁 1回引く · '+fmt(Cosmetics.GACHA_COST)+' COIN':'コンプリート',secondary:'コスメ図鑑',action:pullable.length?pullCosmetic:showHome,secondaryAction:showCosmeticsCollection});if(!pullable.length)$('modalPrimary').disabled=true}
    function pullCosmetic(){if(gachaBusy)return;const before=data,result=Cosmetics.pull(data,Math.random);if(!result.ok){toast(result.reason==='insufficient-coins'?'COINが足りません':'コスメガチャはコンプリート済み');return}gachaBusy=true;data=result.profile;if(!save()){data=before;refreshStats();gachaBusy=false;return}showCosmeticOpening(result.item)}
    function showCosmeticOpening(item){const reveal=()=>{if(!gachaBusy)return;if(gachaTimer)clearTimeout(gachaTimer);gachaTimer=null;gachaBusy=false;showCosmeticResult(item)};showModal({title:'COSMETIC GACHA · OPENING',body:'<div class="gacha-box"><div style="font-size:55px">🎁</div><b>開封中...</b></div><p>COIN消費とアイテム取得は保存済みです。</p>',primary:'演出をスキップ',secondary:'',action:reveal});gachaTimer=setTimeout(reveal,700)}
    function showCosmeticResult(item){showModal({title:'NEW COSMETIC!',body:'<div class="gacha-box"><div style="font-size:55px">'+item.icon+'</div><b>'+item.name+'</b><p>NEW · '+(item.type==='effect'?'消去エフェクト':'プロフィール称号')+'</p></div><p>アイテムをコレクションに登録しました。装備はコスメ図鑑から行えます。</p>',primary:'COSMETICSを見る',secondary:'もう1回引く',action:showCosmeticsCollection,secondaryAction:showCosmeticGacha})}
    function showAchievements(){const html='<p class="progress-copy">解除 '+data.achievements.length+' / '+ACHIEVEMENTS.length+'</p><div class="ach-list">'+ACHIEVEMENTS.map(a=>'<div class="ach '+(data.achievements.includes(a[0])?'unlocked':'')+'"><span>'+a[1]+'<br><small>'+a[2]+'</small></span><b>'+(data.achievements.includes(a[0])?'✓':'🔒')+'</b></div>').join('')+'</div>';
      showModal({title:'🏅 実績',body:html,primary:'閉じる',secondary:'📖 ことば',action:closeModal,secondaryAction:showWords})}
    function showTutorial(){showModal({title:'HOW TO PLAY',body:'<p class="tutorial-intro">絵文字をつないで消す、60秒のスコアアタック。遊びながら英単語の発音と意味にふれて、WORD COLLECTIONを広げよう。</p><div class="tutorial-sections"><article class="tutorial-card"><b>🎮 パズルの遊び方</b><p>同じ絵文字をマウスまたは指でなぞります。上下左右・斜めに隣り合う同じ絵を3個以上つなぎ、指やボタンを離すと消去。空いた場所には新しいピースが落ちてきます。</p></article><article class="tutorial-card"><b>⭐ スコアとフィーバー</b><p>長いチェーンほど高得点。3〜4個×1、5〜6個×1.5、7〜9個×2、10個以上×3。合計30ピース消すと10秒間フィーバーになり、得点が2倍です。</p></article><article class="tutorial-card"><b>📚 NORMAL · ことばを集める</b><p>60秒でハイスコアを目指します。プレイで獲得したスコアは累計解放スコアに加算。単語は運ではなく、累計スコアに応じて順番に解放されます。COLLECTIONで意味を見たり、解放済みの6語を編成できます。</p></article><article class="tutorial-card"><b>🃏 SURVIVAL · デッキを育てる</b><p>6語のデッキでステージ目標に挑戦。カテゴリーで役を作り、クリア報酬から単語交換や強化を選んで次のステージへ進みます。目標に届かないとラン終了です。</p></article><article class="tutorial-card"><b>🧭 SURVIVALの役</b><p>同じカテゴリー4語以上で「カテゴリー特化」×1.20。2カテゴリーを3語ずつなら、前回と違うカテゴリーの消去が×1.30。6語すべて別カテゴリーなら「レインボー」×1.15。</p></article><article class="tutorial-card"><b>🎨 OPTIONS · 自分好みに</b><p>盤面テーマや消去エフェクト、プロフィール称号を設定できます。コスメは見た目だけで、スコアやパズルの判定には影響しません。</p></article></div>',primary:'メニューへ',secondary:'▶ NORMALを始める',action:showHome,secondaryAction:start})}
    function showOptions(){const muted=soundOn?'🔊 サウンド：ON':'🔇 サウンド：OFF';showModal({title:'⚙️ OPTIONS',body:profileSummaryHTML()+'<p class="options-note">遊び方・コレクション・外観設定はこちらから。サウンドと英語発音は別々に確認できます。</p><div class="option-menu"><button class="wide secondary" id="optionSound">'+muted+'</button><button class="wide secondary" id="optionVoice">🗣️ 英語音声をテスト</button><button class="wide secondary" id="optionShop">🛍️ COSMETIC SHOP</button><button class="wide secondary" id="optionGacha">🎁 COSMETIC GACHA</button><button class="wide secondary" id="optionCollection">📚 COLLECTION · '+data.unlocked.length+'/100</button><button class="wide secondary" id="optionAch">🏅 実績</button><button class="wide secondary" id="optionRoles">🧭 SURVIVALの役ガイド</button><button class="wide secondary" id="optionTutorial">📖 チュートリアル</button></div><p class="options-note">盤面テーマ・エフェクト・称号はコスメ図鑑から装備できます。</p>',primary:'メニューへ',secondary:'チュートリアル',action:showHome,secondaryAction:showTutorial});$('optionSound').onclick=()=>{$('soundToggle').click();showOptions()};$('optionVoice').onclick=()=>{primeSpeech();say(wordById(currentDeck()[0]));toast('英語の発音を再生しています')};$('optionShop').onclick=showShop;$('optionGacha').onclick=showCosmeticGacha;$('optionCollection').onclick=showWords;$('optionAch').onclick=showAchievements;$('optionRoles').onclick=()=>showRoleGuide(showOptions);$('optionTutorial').onclick=showTutorial}
    function showHome(){stopBgm();mode='classic';$('runPanel').classList.add('hidden');const canResume=survivalRecord.run&&survivalRecord.run.active;const body='<div class="home-hero"><div><div class="home-kicker">A PUZZLE THAT SPEAKS</div><div class="home-title">WORD<span>CHAIN</span></div><p class="home-subtitle">つなげて、消して、英語がひびく。<br>ひらめきのチェーンで、ことばの世界を広げよう。</p></div><div class="home-art" aria-hidden="true"><div class="home-orbit"></div><span class="home-tile">🐶</span><span class="home-tile">🍎</span><span class="home-tile">🚀</span><span class="home-tile">🌈</span><span class="home-tile">🦁</span><span class="home-tile">🐱</span></div></div><div class="home-menu"><button class="home-menu-btn primary" id="homeNormal"><span class="home-menu-icon">🎯</span><span><b>NORMAL</b><small>60秒のスコアアタック · 単語を解放</small></span><span class="home-menu-arrow">›</span></button><button class="home-menu-btn" id="homeSurvival"><span class="home-menu-icon">🃏</span><span><b>SURVIVAL α</b><small>'+(canResume?'ステージ '+survivalRecord.run.stage+' から再開':'役を作ってステージを突破')+'</small></span><span class="home-menu-arrow">›</span></button><button class="home-menu-btn" id="homeTutorial"><span class="home-menu-icon">📖</span><span><b>TUTORIAL</b><small>ルール・目的・役のしくみ</small></span><span class="home-menu-arrow">›</span></button><button class="home-menu-btn" id="homeOptions"><span class="home-menu-icon">⚙️</span><span><b>OPTIONS</b><small>コスメ・図鑑・サウンド・実績</small></span><span class="home-menu-arrow">›</span></button></div><div class="home-foot"><span>📚 WORDS <strong>'+data.unlocked.length+' / 100</strong>　·　💰 COIN <strong>'+fmt(data.coins)+'</strong></span><span>VOCAB LV. <strong>'+Collection.levelForXP(data.vocabularyXP).level+'</strong></span></div>';showModal({title:'WORD CHAIN',body,variant:'home'});$('homeNormal').onclick=start;$('homeSurvival').onclick=canResume?resumeSurvival:launchSurvival;$('homeTutorial').onclick=showTutorial;$('homeOptions').onclick=showOptions}


    $('playBtn').addEventListener('click',()=>playing?endGame():start());$('wordsBtn').addEventListener('click',showWords);$('achBtn').addEventListener('click',showAchievements);$('helpBtn').addEventListener('click',()=>showModal({title:'あそびかた',body:'<p>同じ絵文字を上下左右・斜めにつないで、3個以上で消去！</p><p>長くつなぐほど高得点。30個消すと10秒間のフィーバーが発動します。</p><p>時間がなくなる前にスコアを伸ばして、単語やコスメを集めよう。</p>',primary:'ゲームへ戻る',secondary:'📖 ことば図鑑',action:closeModal,secondaryAction:showWords}));
    $('soundToggle').setAttribute('aria-label','BGMと効果音を切り替え');$('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊':'🔇';if(!soundOn){if(bgm)bgm.pause()}else{playTone('select');if(playing)playBgm(mode)}});$('voiceTest').addEventListener('click',()=>say(wordById(currentDeck()[0])));if('speechSynthesis'in window){refreshVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices)}board.addEventListener('pointerdown',down);board.addEventListener('pointermove',move);window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);window.addEventListener('resize',drawLinks);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(active)finish();if(bgm)bgm.pause()}else if(playing&&soundOn&&bgmMode&&pendingVoices===0){bgm.play().catch(()=>{})}});
    document.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel()});
    if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    applyCosmeticAppearance();refreshStats();newBoard();updateFeverUI();showHome();
  })();
  </script>
