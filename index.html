  <style>

    .fever{width:100%;background:#090a204c;border:1px solid #ffffff18;border-radius:14px;padding:6px 10px 7px}.fever-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.4px;margin-bottom:5px}.fever-title{color:#f8d9ff}.fever-title.hot{color:#fff;text-shadow:0 0 11px #ff6eff}.meter{height:9px;background:#ffffff20;border-radius:99px;overflow:hidden}.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#58e8ff,#ff78ce,#ffe66b);border-radius:99px;transition:width .22s ease;box-shadow:0 0 10px #ff80dc}
    .word-card{width:100%;height:clamp(54px,9dvh,80px);min-height:50px;border-radius:17px;background:#080a2052;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.word-card strong{font-size:clamp(27px,8vw,42px);color:var(--gold);line-height:1;text-shadow:0 3px 12px #0007;letter-spacing:1px}.word-card span{font-size:11px;color:#d4d7fa;margin-top:4px}.combo{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:900;color:#fff;background:#ff6aaf55;border:1px solid #ffb4dc55;padding:4px 7px;border-radius:9px;opacity:0;transition:opacity .15s}.combo.show{opacity:1}
    .board-wrap{position:relative;width:var(--board-size);max-width:100%;aspect-ratio:1;flex:0 0 auto;isolation:isolate}.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:clamp(3px,.8vw,6px);padding:clamp(4px,1vw,7px);border-radius:20px;background:#090b21c9;box-shadow:0 15px 32px #07091d70,inset 0 1px 0 #ffffff24;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}.tile{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;border-radius:clamp(8px,2.2vw,14px);background:linear-gradient(155deg,#fff,#dbe5ff 68%,#adbee7);box-shadow:inset 0 -3px 0 #8293bb,0 2px 4px #0003;color:#252746;font-size:clamp(21px,7.6vw,42px);line-height:1;transform:scale(1);transition:transform .11s,filter .11s,box-shadow .11s,opacity .12s;will-change:transform,opacity}.tile.selected{z-index:3;transform:scale(.88);filter:brightness(1.12);box-shadow:0 0 0 3px #ffe37c,0 0 16px 5px #ffe37caa,inset 0 -3px 0 #c2a24b}.tile.clearing{animation:clearTile .16s ease-in forwards}.tile.drop-in{animation:drop .22s cubic-bezier(.16,.8,.3,1) both}@keyframes clearTile{to{transform:scale(.15) rotate(18deg);opacity:0;filter:brightness(2)}}@keyframes drop{from{transform:translateY(-38px) scale(.88);opacity:.3}to{transform:translateY(0) scale(1);opacity:1}}
    .link-layer{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;overflow:visible}.link-line{fill:none;stroke:#fff174;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ffce42)}
    .instructions{text-align:center;font-size:11px;color:#d6d8f2;min-height:15px;margin:-3px 0 0}.controls{width:100%;display:flex;gap:8px}.control{flex:1;background:#ffffff17;border:1px solid #ffffff20;border-radius:13px;padding:9px 5px;font-size:12px;font-weight:850}.control.primary{background:linear-gradient(90deg,#ffd55c,#ff934e);color:#302249;border:0}.bottom{font-size:9px;color:#aeb2d3;min-height:11px;text-align:center}
    .overlay{position:fixed;inset:0;z-index:20;background:#080a1cce;display:flex;align-items:center;justify-content:center;padding:18px;padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 18px);backdrop-filter:blur(8px)}.hidden{display:none!important}.overlay.hidden{display:none}.modal{width:min(440px,100%);max-height:100%;overflow:auto;background:linear-gradient(155deg,#36376f,#22264c);border:1px solid #ffffff30;border-radius:25px;padding:22px 20px;box-shadow:0 24px 80px #0009;text-align:center}.modal h2{font-size:27px;margin:3px 0 9px}.modal p,.modal-copy{color:#e1e2f6;line-height:1.65;font-size:14px;margin:9px 0 17px}.modal .big{font-size:42px;font-weight:1000;color:var(--gold);line-height:1.1}.modal .muted{font-size:12px;color:#c2c5e0}.modal-actions{display:grid;gap:9px}.wide{width:100%;border-radius:14px;padding:13px 12px;font-weight:950;font-size:17px;background:linear-gradient(90deg,#ffd55c,#ff934e);color:#302249}.wide.secondary{background:#ffffff18;color:white;border:1px solid #ffffff22;font-size:14px;padding:11px}.grid-words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left}.word-option{display:flex;align-items:center;gap:8px;background:#ffffff12;border:1px solid #ffffff14;border-radius:12px;padding:9px;min-width:0}.word-option input{accent-color:#ffca5a;width:17px;height:17px;flex:0 0 auto}.word-option .emoji{font-size:25px}.word-option .name{font-size:11px;font-weight:900;overflow:hidden;text-overflow:ellipsis}.word-option small{display:block;color:#bdc1df;font-size:9px;font-weight:600}.word-option.locked{opacity:.48}.collection-title{font-size:11px;color:#c7c9e7;text-align:left;margin:14px 0 7px}.progress-copy{font-size:11px;color:#dce0fc;margin:0 0 7px}.ach-list{display:grid;gap:7px;text-align:left}.ach{background:#ffffff12;border-radius:11px;padding:9px 10px;font-size:12px;display:flex;justify-content:space-between;gap:7px}.ach.unlocked{border:1px solid #ffdf7355;color:#ffe991}.toast-wrap{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);display:grid;gap:7px;width:min(92vw,390px);pointer-events:none}.toast{background:#252852f2;border:1px solid #ffffff36;border-left:5px solid var(--gold);border-radius:13px;padding:10px 13px;font-size:12px;font-weight:800;box-shadow:0 8px 24px #0007;animation:toastIn .22s ease-out,toastOut .25s ease-in 3.6s forwards}.toast.achievement{border-left-color:#77f0db}.toast.unlock{border-left-color:#ff83ce}@keyframes toastIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}@keyframes toastOut{to{opacity:0;transform:translateY(-9px)}}.float-score{position:absolute;z-index:5;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(21px,7vw,33px);font-weight:1000;color:#fff27c;text-shadow:0 3px 9px #000a;pointer-events:none;animation:floatUp .85s ease-out forwards;white-space:nowrap}@keyframes floatUp{to{transform:translate(-50%,-125%);opacity:0}}.fever-flash{position:fixed;inset:0;z-index:18;pointer-events:none;background:#ff61c440;animation:flash .55s ease-out forwards}@keyframes flash{to{opacity:0}}
    @media(max-height:680px){.app{gap:4px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}.tagline{display:none}.stat{padding:3px 2px 5px}.fever{padding:4px 8px}.word-card{height:48px;min-height:44px}.board{border-radius:15px}.instructions{font-size:10px}.control{padding:7px 4px}.bottom{display:none}}
    @media(max-height:570px){:root{--board-size:min(64vw,calc(100dvh - 205px),470px)}.app{flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 10px;padding-left:8px;padding-right:8px}.top{width:100%;height:30px;min-height:30px}.stats{width:calc(100% - var(--board-size) - 12px);grid-template-columns:1fr}.stat{display:flex;align-items:center;justify-content:space-between;padding:3px 8px}.stat b{font-size:18px}.fever{width:calc(100% - var(--board-size) - 12px)}.word-card{width:calc(100% - var(--board-size) - 12px)}.board-wrap{order:3}.stats{order:2}.fever{order:4}.word-card{order:5}.instructions{order:6;width:100%}.controls{order:7;width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
    /* Fever stays colorful but avoids hue cycling, flashing, and recoloring emoji. */
    body.fevery{background:radial-gradient(ellipse at 50% 35%,#4a426d 0,#292747 48%,#17172f 100%);animation:none}
    body.fevery .board{border:2px solid #d8b86d;box-shadow:0 0 18px #d8b86d33,0 15px 32px #07091d70,inset 0 1px 0 #ffffff24}
    body.fevery .fever{border-color:#d8b86d;background:#28223d}
    body.fevery .fever .meter-fill{background:linear-gradient(90deg,#f2c96d,#e7a76d);box-shadow:0 0 7px #e7c07855}
    .fever-title.hot{color:#ffe6ac;text-shadow:none}
    .fever-flash{display:none}
    .fever-celebration{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .45s ease;background:radial-gradient(ellipse at 8% 78%,#e7b87518 0,transparent 38%),radial-gradient(ellipse at 92% 25%,#b994dc18 0,transparent 40%)}
    body.fevery .fever-celebration{opacity:1}
    .fever-particle{position:absolute;bottom:-24px;left:var(--x);width:var(--size);height:var(--size);border:1px solid #fff8;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--color) 55%,#ffffff05 100%);box-shadow:0 0 12px color-mix(in srgb,var(--color) 45%,transparent);opacity:0;animation:feverRise var(--duration) ease-out forwards}
    .filters{display:flex;gap:6px;margin:8px 0}.filters select{min-width:0;flex:1;background:#25274d;color:white;border:1px solid #ffffff30;border-radius:9px;padding:7px;font:inherit;font-size:11px}.dictionary{max-height:47vh;overflow:auto;display:grid;gap:6px}.dict-card{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:6px;text-align:left;background:#ffffff10;border-radius:10px;padding:7px}.dict-card .emoji{font-size:25px}.dict-card b{font-size:11px}.dict-card small{display:block;color:#d0d4ed;font-size:9px}.dict-card .lock{font-size:9px;color:#ffd983}.run-panel{width:100%;padding:5px 9px;background:#4f3b6b80;border:1px solid #e5be7544;border-radius:12px;text-align:center;font-size:11px;font-weight:900}.run-panel.hidden{display:none}.role-card{background:#ffffff16;border:1px solid #ffffff25;border-radius:12px;padding:9px;margin:8px 0;text-align:left;font-size:12px}.choice-list{display:grid;gap:7px;text-align:left}.choice{border-radius:11px;padding:10px;background:#ffffff14;border:1px solid #ffffff20;font-size:12px}.choice.active{border-color:#ffe16d;background:#ffe16d20}.role-preview{min-height:56px}.choice-btn{width:100%;margin-top:6px;border-radius:11px;padding:10px;background:#ffffff15}
    @keyframes feverRise{12%{opacity:.42}75%{opacity:.28}to{transform:translate3d(var(--drift),-55vh,0) scale(.55);opacity:0}}
    @media(prefers-reduced-motion:reduce){.fever-celebration{transition:none}.fever-particle{display:none}}
  </style>
</head>
<body>
  <div class="fever-celebration" id="feverCelebration" aria-hidden="true"></div>
  <main class="app" id="app">
    <header class="top"><div class="brand">🐾 WORD <span>CHAIN</span></div><div class="top-actions"><button class="icon-btn" id="soundToggle" aria-label="効果音を切り替え">🔊</button><button class="icon-btn" id="voiceTest" aria-label="英語音声をテスト">🗣️</button><button class="icon-btn" id="helpBtn" aria-label="遊び方">?</button></div></header>
    <div class="tagline">つなげて、消して、英語がひびく！</div>
    <section class="stats" aria-label="ゲーム情報"><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="time">60</b><small>TIME</small></div><div class="stat"><b id="best">0</b><small>BEST</small></div></section>
    <div class="run-panel hidden" id="runPanel"></div>
    <section class="fever" aria-label="フィーバーゲージ"><div class="fever-row"><span class="fever-title" id="feverTitle">✨ FEVER CHARGE</span><span id="feverCount">0 / 30</span></div><div class="meter"><div class="meter-fill" id="feverFill"></div></div></section>
    <section class="word-card" aria-live="polite"><strong id="word">READY?</strong><span id="hint">同じ絵を3個以上つなげよう</span><span class="combo" id="combo">3 CHAIN</span></section>
    <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="6行6列のパズル盤面"></div><svg id="links" class="link-layer" aria-hidden="true"><polyline class="link-line" points=""></polyline></svg></div>
    <p class="instructions" id="instructions">同じ絵を3つ以上なぞって、指を離そう</p>
    <div class="controls"><button class="control" id="wordsBtn">📖 ことば <span id="wordCount">6/6</span></button><button class="control primary" id="playBtn">▶ PLAY</button><button class="control" id="achBtn">🏅 実績</button></div>
    <div class="bottom">発音を聞いて、英単語を自然に覚えよう</div>
  </main>
  <div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">🐶 WORD CHAIN</h2><div id="modalText" class="modal-copy">同じ絵を3つ以上つなげて消そう！<br>60秒でスコアを伸ばし、英単語を解放しよう。</div><div class="modal-actions"><button class="wide" id="modalPrimary">▶ PLAY!</button><button class="wide secondary" id="modalSecondary">📖 ことば・編成</button></div></section></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <script src="./game-logic.js"></script>
  <script src="./word-data.js"></script>
  <script src="./survival-logic.js"></script>
  <script>
  (()=>{'use strict';
    const WORDS=WordChainWords.words, BY_ID=WordChainWords.byId, Survival=WordChainSurvival;
    const ACHIEVEMENTS=[['firstPlay','初プレイ','はじめて遊ぶ'],['chain8','8 CHAIN!','1回で8個以上消す'],['firstFever','初フィーバー','フィーバーを発動する'],['score5000','SCORE 5,000','1プレイで5,000点を獲得'],['plays10','10 PLAYS','累計10回プレイする'],['total50000','50,000 POINTS','累計50,000点を獲得']];
    const KEY='word-chain-save',SURVIVAL_KEY='word-chain-survival-v1';const N=6;const BASE=['dog','cat','cow','apple','banana','car'];
    const $=id=>document.getElementById(id);const board=$('board'),overlay=$('overlay');
    let data=loadData(),cells=[],path=[],active=false,playing=false,busy=false,soundOn=true,score=0,bestChain=0,remaining=60,feverProgress=0,feverUntil=0,gameEnds=0,tickHandle=null,pauseStartedAt=null,audioCtx=null,voices=[],feverParticleTimer=null;
    let mode='classic',run=null,stageScore=0,lastCategory=null,rewardOffers=[],exchangePick=null;
    let survivalRecord=loadSurvivalRecord();
    function freshData(){return{version:1,highScore:0,totalScore:0,plays:0,totalCleared:0,achievements:[],unlocked:BASE.slice(),deck:BASE.slice()}}
    function loadData(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){d=null}const base=freshData();if(!d||typeof d!=='object'||Array.isArray(d))return base;
      const num=(v,min=0)=>Number.isFinite(v)&&v>=min?Math.floor(v):0;
      base.highScore=num(d.highScore??d.bestScore);base.totalScore=num(d.totalScore??d.lifetimeScore);base.plays=num(d.plays??d.playCount);base.totalCleared=num(d.totalCleared??d.clearedCount);
      base.achievements=Array.isArray(d.achievements)?ACHIEVEMENTS.map(a=>a[0]).filter(id=>d.achievements.includes(id)):[];
      base.unlocked=Array.isArray(d.unlocked)?[...new Set([...BASE,...d.unlocked.filter(id=>WORDS.some(w=>w.id===id))])]:BASE.slice();
      for(const w of WORDS)if(w.unlockScore&&base.totalScore>=w.unlockScore&&!base.unlocked.includes(w.id))base.unlocked.push(w.id);
      base.deck=Array.isArray(d.deck)?[...new Set(d.deck.filter(id=>base.unlocked.includes(id)))].slice(0,6):BASE.slice();
      for(const id of BASE)if(base.deck.length<6&&!base.deck.includes(id))base.deck.push(id);
      if(base.deck.length>6)base.deck=base.deck.slice(0,6);return base;
    }
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(_){toast('保存できませんでした。端末の空き容量を確認してください','') }refreshStats()}
    function loadSurvivalRecord(){try{return Survival.loadRecord(localStorage.getItem(SURVIVAL_KEY),WORDS)}catch(_){return Survival.loadRecord(null,WORDS)}}
    function saveSurvival(){try{localStorage.setItem(SURVIVAL_KEY,JSON.stringify(survivalRecord))}catch(_){toast('サバイバル記録を保存できませんでした')}}
    function currentDeck(){return mode==='survival'&&run?run.deck:data.deck}
    function refreshStats(){ $('best').textContent=mode==='survival'&&run?fmt(survivalRecord.bestRunScore):data.highScore.toLocaleString();$('wordCount').textContent=data.unlocked.length+'/100'; }
    const wordById=id=>WORDS.find(w=>w.id===id)||WORDS[0];
    function rand(){return Math.floor(Math.random()*currentDeck().length)}
    function makeTile(v,i,extra=''){const d=document.createElement('div');d.className='tile '+extra;d.dataset.i=i;d.setAttribute('role','gridcell');const w=wordById(currentDeck()[v]);if(w.image){const im=document.createElement('img');im.src=w.image;im.alt=w.name;im.draggable=false;im.style.cssText='width:72%;height:72%;object-fit:contain';d.append(im)}else d.textContent=w.emoji;return d}
    function render(extra=new Set()){board.replaceChildren();cells.forEach((v,i)=>board.append(makeTile(v,i,extra.has(i)?'drop-in':'')));drawLinks()}
    const adjacent=WordChainLogic.adjacent;
    function hasMove(arr=cells){return WordChainLogic.hasMove(arr,N)}
    function shuffleEnsure(){for(let tries=0;tries<300;tries++){for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}if(hasMove())return}cells[0]=0;cells[1]=0;cells[2]=0}
    function newBoard(){cells=Array.from({length:N*N},rand);if(!hasMove())shuffleEnsure();render()}
    function cellCenter(i){const t=board.querySelector('[data-i="'+i+'"]');if(!t)return null;const b=board.getBoundingClientRect(),r=t.getBoundingClientRect();return{x:r.left-b.left+r.width/2,y:r.top-b.top+r.height/2}}
    function drawLinks(){const poly=$('links').querySelector('polyline');$('links').setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);const pts=path.map(cellCenter).filter(Boolean).map(p=>p.x+','+p.y).join(' ');poly.setAttribute('points',pts)}
    function select(i){if(!playing||busy||i<0||i>=cells.length)return;if(!active){active=true;path=[i];playTone('select')}else{const last=path[path.length-1];if(path.length>1&&i===path[path.length-2])path.pop();else if(!path.includes(i)&&adjacent(last,i)&&cells[last]===cells[i])path.push(i)}render()}
    function atPoint(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.tile')}
    function down(e){const tile=e.target.closest('.tile');if(!tile||!playing||busy)return;e.preventDefault();board.setPointerCapture?.(e.pointerId);select(Number(tile.dataset.i))}
    function move(e){if(!active)return;e.preventDefault();const tile=atPoint(e);if(tile)select(Number(tile.dataset.i))}
    const scoreMultiplier=WordChainLogic.multiplier;
    function fmt(n){return Math.floor(n).toLocaleString()}
    function refreshVoices(){if('speechSynthesis'in window)voices=window.speechSynthesis.getVoices()||[]}

    function playTone(kind){if(!soundOn)return;const c=getAudio();if(!c)return;const now=c.currentTime;const notes=kind==='fever'?[523,659,784,1047]:kind==='clear'?[660,880]:kind==='select'?[480]:[740];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==='fever'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(kind==='select'?.035:.06,now+i*.07+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.14);o.connect(g).connect(c.destination);o.start(now+i*.07);o.stop(now+i*.07+.15)})}

    function spawnFeverParticles(count=4){const layer=$('feverCelebration');const colors=['#ffd982','#f7a7ce','#a9e6ed','#c6b1f2'];for(let i=0;i<count;i++){const p=document.createElement('i');p.className='fever-particle';const side=Math.random()<.5;const x=side?3+Math.random()*18:79+Math.random()*18;p.style.setProperty('--x',x+'vw');p.style.setProperty('--size',(9+Math.random()*13)+'px');p.style.setProperty('--color',colors[Math.floor(Math.random()*colors.length)]);p.style.setProperty('--duration',(2.5+Math.random()*1.1)+'s');p.style.setProperty('--drift',(-18+Math.random()*36)+'px');p.style.animationDelay=(Math.random()*.25)+'s';layer.append(p);setTimeout(()=>p.remove(),4200)}}
    function updateFeverUI(){const fever=feverUntil>Date.now();$('feverTitle').classList.toggle('hot',fever);$('feverTitle').textContent=fever?'🔥 FEVER!':'✨ FEVER CHARGE';$('feverCount').textContent=fever?((Math.max(0,feverUntil-Date.now())/1000).toFixed(1)+' 秒'):feverProgress+' / 30';$('feverFill').style.width=fever?Math.max(0,Math.min(100,(feverUntil-Date.now())/10000*100))+'%':(feverProgress/30*100)+'%';document.body.classList.toggle('fevery',fever);if(fever&&!feverParticleTimer){spawnFeverParticles(10);feverParticleTimer=setInterval(()=>spawnFeverParticles(3),850)}else if(!fever&&feverParticleTimer){clearInterval(feverParticleTimer);feverParticleTimer=null}}

      if(mode==='survival'&&run){const category=word.category,role=Survival.roleForDeck(run.deck,BY_ID),roleMult=Survival.roleMultiplier(role,category,lastCategory);points=Survival.scoreClear({count:len,fever:isFever,role:roleMult,globalStacks:run.upgrades.global,categoryStacks:run.upgrades.category[category]||0,chainStacks:run.upgrades.chain,categoryMatches:true});stageScore+=points;score+=points;run.runScore+=points;lastCategory=category;survivalRecord.encountered=[...new Set([...survivalRecord.encountered,word.id])];run.encountered=[...new Set([...run.encountered,word.id])];run.stageScore=stageScore;survivalRecord.bestStage=Math.max(survivalRecord.bestStage,run.stage);survivalRecord.bestRunScore=Math.max(survivalRecord.bestRunScore,run.runScore);saveSurvival()}

    function offerRewards(){if(!run||run.phase==='reward')return;run.phase='reward';const cats=[...new Set(run.deck.map(id=>BY_ID[id].category))].filter(c=>(run.upgrades.category[c]||0)<3);const generic=[['global','全消去得点 +10%'],['fever','フィーバー必要数 −3'],['time','制限時間 +5秒'],['chain','5個以上チェーン +15%']].filter(([k])=>(run.upgrades[k]||0)<3);const g=generic.length?generic[Math.floor(Math.random()*generic.length)]:['global','全消去得点 +10%'];const category= cats.length?cats[Math.floor(Math.random()*cats.length)]:null;rewardOffers=[{type:'exchange',title:'単語交換',copy:'単語を交換して役を組み直す'},{type:'category',category,title:'カテゴリー強化',copy:category?category+' 消去得点 +15%':'全消去得点 +10%'},{type:g[0],title:'汎用強化',copy:g[1]}];survivalRecord.run=run;saveSurvival();const html=rewardOffers.map((r,i)=>'<div class="choice"><b>'+(i+1)+'. '+r.title+'</b><br>'+r.copy+'<button class="choice-btn" data-reward="'+i+'">この報酬を選ぶ</button></div>').join('');showModal({title:'報酬を1つ選択',body:'<p>タイマー停止中 · 星の数で報酬内容は変わりません</p><div class="choice-list">'+html+'</div>',primary:'閉じる',secondary:'',action:()=>{}});document.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>selectReward(+b.dataset.reward))}

    function showWords(){const next=WORDS.filter(w=>w.unlockScore>0&&!data.unlocked.includes(w.id)).sort((a,b)=>a.unlockScore-b.unlockScore)[0];const unlockedCount=data.unlocked.length;const cards=WORDS.map(w=>{const ok=data.unlocked.includes(w.id),checked=data.deck.includes(w.id);return '<div class="dict-card" data-cat="'+w.category+'" data-diff="'+w.difficulty+'"><span class="emoji">'+w.icon+'</span><span><b>'+w.word+'</b><small>'+w.meaning+' · '+w.category+' · '+(w.difficulty==='basic'?'基本':'上級')+' · '+(survivalRecord.encountered.includes(w.id)?'サバイバル遭遇済み':'未遭遇')+'</small></span>'+(ok?'<label><input type="checkbox" value="'+w.id+'" '+(checked?'checked':'')+'><small>編成</small></label>':'<span class="lock">🔒 '+fmt(w.unlockScore)+'</span>')+'</div>'}).join('');const cats=['すべて',...WordChainWords.categories].map(c=>'<option>'+c+'</option>').join('');const priorUnlock=next?Math.max(0,...data.unlocked.map(id=>BY_ID[id]?.unlockScore||0)):0;const unlockProgress=next?Math.max(0,Math.min(100,(data.totalScore-priorUnlock)/(next.unlockScore-priorUnlock||1)*100)):100;const nextCopy=next?'次の解放：'+next.icon+' '+next.word+' · 累計 '+fmt(data.totalScore)+' / '+fmt(next.unlockScore):'通常モードの全単語を解放済み';showModal({title:'📖 100語 図鑑・編成',body:'<p class="progress-copy">通常モード解放 '+unlockedCount+' / 100 · 累計 '+fmt(data.totalScore)+' 点</p><div class="meter"><div class="meter-fill" style="width:'+unlockProgress+'%"></div></div><p class="progress-copy">'+nextCopy+'</p><div class="filters"><select id="dictCategory">'+cats+'</select><select id="dictDifficulty"><option value="all">全難易度</option><option value="basic">基本</option><option value="advanced">上級</option></select></div><div class="collection-title">解放済み単語から6語を選択。遭遇記録は通常解放と別です。</div><div class="dictionary">'+cards+'</div>',primary:'保存して閉じる',secondary:'戻る',action:()=>{const chosen=[...document.querySelectorAll('.dict-card input:checked')].map(e=>e.value);if(chosen.length!==6){toast('盤面に出すことばを6種類選んでください');return}data.deck=chosen;save();if(mode===
