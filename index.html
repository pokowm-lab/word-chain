<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#171638">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>WORD CHAIN β1</title>
  <style>
    :root{color-scheme:dark;--ink:#fff;--muted:#b9bedf;--gold:#ffe16d;--pink:#ff73ba;--cyan:#66eaff;--panel:#ffffff14;--board-size:min(92vw,52dvh,520px)}
    *{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 32%,#444284 0,#242654 43%,#111329 100%);touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    body.fevery{background:radial-gradient(ellipse at 50% 35%,#a33e83 0,#482759 48%,#17142d 100%);animation:feverbg 1.4s ease-in-out infinite alternate}
    @keyframes feverbg{to{filter:hue-rotate(22deg) brightness(1.16)}}
    button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}
    .app{width:min(100%,620px);height:100vh;height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.1dvh,11px);overflow:hidden}
    .top{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:39px}.brand{font-size:clamp(21px,6vw,30px);font-weight:1000;letter-spacing:1px;text-shadow:0 3px 12px #0008}.brand span{color:var(--gold)}.top-actions{display:flex;gap:7px}.icon-btn{border-radius:12px;background:#ffffff18;padding:8px 11px;font-size:18px}
    .tagline{color:#e4e5ff;font-size:12px;opacity:.83;margin-top:-7px}
    .stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--panel);border:1px solid #ffffff15;border-radius:14px;text-align:center;padding:5px 3px 7px;min-width:0}.stat b{display:block;font-size:clamp(19px,5.7vw,28px);line-height:1.15;font-variant-numeric:tabular-nums}.stat small{font-size:9px;color:var(--muted);letter-spacing:.8px;font-weight:800}
    .fever{width:100%;background:#090a204c;border:1px solid #ffffff18;border-radius:14px;padding:6px 10px 7px}.fever-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.4px;margin-bottom:5px}.fever-title{color:#f8d9ff}.fever-title.hot{color:#fff;text-shadow:0 0 11px #ff6eff}.meter{height:9px;background:#ffffff20;border-radius:99px;overflow:hidden}.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#58e8ff,#ff78ce,#ffe66b);border-radius:99px;transition:width .22s ease;box-shadow:0 0 10px #ff80dc}
    .word-card{width:100%;height:clamp(54px,9dvh,80px);min-height:50px;border-radius:17px;background:#080a2052;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.word-card strong{font-size:clamp(27px,8vw,42px);color:var(--gold);line-height:1;text-shadow:0 3px 12px #0007;letter-spacing:1px}.word-card span{font-size:11px;color:#d4d7fa;margin-top:4px}.combo{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:900;color:#fff;background:#ff6aaf55;border:1px solid #ffb4dc55;padding:4px 7px;border-radius:9px;opacity:0;transition:opacity .15s}.combo.show{opacity:1}
    .board-wrap{position:relative;width:var(--board-size);max-width:100%;aspect-ratio:1;flex:0 0 auto;isolation:isolate}.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:clamp(3px,.8vw,6px);padding:clamp(4px,1vw,7px);border-radius:20px;background:#090b21c9;box-shadow:0 15px 32px #07091d70,inset 0 1px 0 #ffffff24;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}.tile{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;border-radius:clamp(8px,2.2vw,14px);background:linear-gradient(155deg,#fff,#dbe5ff 68%,#adbee7);box-shadow:inset 0 -3px 0 #8293bb,0 2px 4px #0003;color:#252746;font-size:clamp(21px,7.6vw,42px);line-height:1;transform:scale(1);transition:transform .11s,filter .11s,box-shadow .11s,opacity .12s;will-change:transform,opacity}.tile.selected{z-index:3;transform:scale(.88);filter:brightness(1.12);box-shadow:0 0 0 3px #ffe37c,0 0 16px 5px #ffe37caa,inset 0 -3px 0 #c2a24b}.tile.clearing{animation:clearTile .16s ease-in forwards}.tile.drop-in{animation:drop .22s cubic-bezier(.16,.8,.3,1) both}@keyframes clearTile{to{transform:scale(.15) rotate(18deg);opacity:0;filter:brightness(2)}}@keyframes drop{from{transform:translateY(-38px) scale(.88);opacity:.3}to{transform:translateY(0) scale(1);opacity:1}}
    .link-layer{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;overflow:visible}.link-line{fill:none;stroke:#fff174;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ffce42)}
    .instructions{text-align:center;font-size:11px;color:#d6d8f2;min-height:15px;margin:-3px 0 0}.controls{width:100%;display:flex;gap:8px}.control{flex:1;background:#ffffff17;border:1px solid #ffffff20;border-radius:13px;padding:9px 5px;font-size:12px;font-weight:850}.control.primary{background:linear-gradient(90deg,#ffd55c,#ff934e);color:#302249;border:0}.bottom{font-size:9px;color:#aeb2d3;min-height:11px;text-align:center}
    .overlay{position:fixed;inset:0;z-index:20;background:#080a1cce;display:flex;align-items:center;justify-content:center;padding:18px;padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 18px);backdrop-filter:blur(8px)}.overlay.hidden{display:none}.modal{width:min(440px,100%);max-height:100%;overflow:auto;background:linear-gradient(155deg,#36376f,#22264c);border:1px solid #ffffff30;border-radius:25px;padding:22px 20px;box-shadow:0 24px 80px #0009;text-align:center}.modal h2{font-size:27px;margin:3px 0 9px}.modal p,.modal-copy{color:#e1e2f6;line-height:1.65;font-size:14px;margin:9px 0 17px}.modal .big{font-size:42px;font-weight:1000;color:var(--gold);line-height:1.1}.modal .muted{font-size:12px;color:#c2c5e0}.modal-actions{display:grid;gap:9px}.wide{width:100%;border-radius:14px;padding:13px 12px;font-weight:950;font-size:17px;background:linear-gradient(90deg,#ffd55c,#ff934e);color:#302249}.wide.secondary{background:#ffffff18;color:white;border:1px solid #ffffff22;font-size:14px;padding:11px}.grid-words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left}.word-option{display:flex;align-items:center;gap:8px;background:#ffffff12;border:1px solid #ffffff14;border-radius:12px;padding:9px;min-width:0}.word-option input{accent-color:#ffca5a;width:17px;height:17px;flex:0 0 auto}.word-option .emoji{font-size:25px}.word-option .name{font-size:11px;font-weight:900;overflow:hidden;text-overflow:ellipsis}.word-option small{display:block;color:#bdc1df;font-size:9px;font-weight:600}.word-option.locked{opacity:.48}.collection-title{font-size:11px;color:#c7c9e7;text-align:left;margin:14px 0 7px}.progress-copy{font-size:11px;color:#dce0fc;margin:0 0 7px}.ach-list{display:grid;gap:7px;text-align:left}.ach{background:#ffffff12;border-radius:11px;padding:9px 10px;font-size:12px;display:flex;justify-content:space-between;gap:7px}.ach.unlocked{border:1px solid #ffdf7355;color:#ffe991}.toast-wrap{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);display:grid;gap:7px;width:min(92vw,390px);pointer-events:none}.toast{background:#252852f2;border:1px solid #ffffff36;border-left:5px solid var(--gold);border-radius:13px;padding:10px 13px;font-size:12px;font-weight:800;box-shadow:0 8px 24px #0007;animation:toastIn .22s ease-out,toastOut .25s ease-in 3.6s forwards}.toast.achievement{border-left-color:#77f0db}.toast.unlock{border-left-color:#ff83ce}@keyframes toastIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}@keyframes toastOut{to{opacity:0;transform:translateY(-9px)}}.float-score{position:absolute;z-index:5;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(21px,7vw,33px);font-weight:1000;color:#fff27c;text-shadow:0 3px 9px #000a;pointer-events:none;animation:floatUp .85s ease-out forwards;white-space:nowrap}@keyframes floatUp{to{transform:translate(-50%,-125%);opacity:0}}.fever-flash{position:fixed;inset:0;z-index:18;pointer-events:none;background:#ff61c440;animation:flash .55s ease-out forwards}@keyframes flash{to{opacity:0}}
    @media(max-height:680px){.app{gap:4px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}.tagline{display:none}.stat{padding:3px 2px 5px}.fever{padding:4px 8px}.word-card{height:48px;min-height:44px}.board{border-radius:15px}.instructions{font-size:10px}.control{padding:7px 4px}.bottom{display:none}}
    @media(max-height:570px){:root{--board-size:min(64vw,calc(100dvh - 205px),470px)}.app{flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 10px;padding-left:8px;padding-right:8px}.top{width:100%;height:30px;min-height:30px}.stats{width:calc(100% - var(--board-size) - 12px);grid-template-columns:1fr}.stat{display:flex;align-items:center;justify-content:space-between;padding:3px 8px}.stat b{font-size:18px}.fever{width:calc(100% - var(--board-size) - 12px)}.word-card{width:calc(100% - var(--board-size) - 12px)}.board-wrap{order:3}.stats{order:2}.fever{order:4}.word-card{order:5}.instructions{order:6;width:100%}.controls{order:7;width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="top"><div class="brand">🐾 WORD <span>CHAIN</span></div><div class="top-actions"><button class="icon-btn" id="soundToggle" aria-label="効果音を切り替え">🔊</button><button class="icon-btn" id="voiceTest" aria-label="英語音声をテスト">🗣️</button><button class="icon-btn" id="helpBtn" aria-label="遊び方">?</button></div></header>
    <div class="tagline">つなげて、消して、英語がひびく！</div>
    <section class="stats" aria-label="ゲーム情報"><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="time">60</b><small>TIME</small></div><div class="stat"><b id="best">0</b><small>BEST</small></div></section>
    <section class="fever" aria-label="フィーバーゲージ"><div class="fever-row"><span class="fever-title" id="feverTitle">✨ FEVER CHARGE</span><span id="feverCount">0 / 30</span></div><div class="meter"><div class="meter-fill" id="feverFill"></div></div></section>
    <section class="word-card" aria-live="polite"><strong id="word">READY?</strong><span id="hint">同じ絵を3個以上つなげよう</span><span class="combo" id="combo">3 CHAIN</span></section>
    <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="6行6列のパズル盤面"></div><svg id="links" class="link-layer" aria-hidden="true"><polyline class="link-line" points=""></polyline></svg></div>
    <p class="instructions" id="instructions">同じ絵を3つ以上なぞって、指を離そう</p>
    <div class="controls"><button class="control" id="wordsBtn">📖 ことば <span id="wordCount">6/6</span></button><button class="control primary" id="playBtn">▶ PLAY</button><button class="control" id="achBtn">🏅 実績</button></div>
    <div class="bottom">発音を聞いて、英単語を自然に覚えよう</div>
  </main>
  <div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">🐶 WORD CHAIN</h2><div id="modalText" class="modal-copy">同じ絵を3つ以上つなげて消そう！<br>60秒でスコアを伸ばし、英単語を解放しよう。</div><div class="modal-actions"><button class="wide" id="modalPrimary">▶ PLAY!</button><button class="wide secondary" id="modalSecondary">📖 ことば・編成</button></div></section></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <script src="./game-logic.js"></script>
  <script>
  (()=>{'use strict';
    const WORDS=[
      {id:'dog',emoji:'🐶',name:'DOG',pron:'dog'}, {id:'cat',emoji:'🐱',name:'CAT',pron:'cat'},
      {id:'cow',emoji:'🐮',name:'COW',pron:'cow'}, {id:'apple',emoji:'🍎',name:'APPLE',pron:'apple'},
      {id:'banana',emoji:'🍌',name:'BANANA',pron:'banana'}, {id:'car',emoji:'🚗',name:'CAR',pron:'car'},
      {id:'lion',emoji:'🦁',name:'LION',pron:'lion',unlock:2000}, {id:'elephant',emoji:'🐘',name:'ELEPHANT',pron:'elephant',unlock:5000},
      {id:'rainbow',emoji:'🌈',name:'RAINBOW',pron:'rainbow',unlock:10000}, {id:'rocket',emoji:'🚀',name:'ROCKET',pron:'rocket',unlock:20000},
      {id:'justice',emoji:'⚖️',name:'JUSTICE',pron:'justice',unlock:35000}, {id:'dragon',emoji:'🐉',name:'DRAGON',pron:'dragon',unlock:50000}
    ];
    const ACHIEVEMENTS=[['firstPlay','初プレイ','はじめて遊ぶ'],['chain8','8 CHAIN!','1回で8個以上消す'],['firstFever','初フィーバー','フィーバーを発動する'],['score5000','SCORE 5,000','1プレイで5,000点を獲得'],['plays10','10 PLAYS','累計10回プレイする'],['total50000','50,000 POINTS','累計50,000点を獲得']];
    const KEY='word-chain-save';const N=6;const BASE=WORDS.slice(0,6).map(w=>w.id);
    const $=id=>document.getElementById(id);const board=$('board'),overlay=$('overlay');
    let data=loadData(),cells=[],path=[],active=false,playing=false,busy=false,soundOn=true,score=0,bestChain=0,remaining=60,feverProgress=0,feverUntil=0,gameEnds=0,tickHandle=null,pauseStartedAt=null,audioCtx=null,voices=[];
    function freshData(){return{version:1,highScore:0,totalScore:0,plays:0,totalCleared:0,achievements:[],unlocked:BASE.slice(),deck:BASE.slice()}}
    function loadData(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){d=null}const base=freshData();if(!d||typeof d!=='object'||Array.isArray(d))return base;
      const num=(v,min=0)=>Number.isFinite(v)&&v>=min?Math.floor(v):0;
      base.highScore=num(d.highScore??d.bestScore);base.totalScore=num(d.totalScore??d.lifetimeScore);base.plays=num(d.plays??d.playCount);base.totalCleared=num(d.totalCleared??d.clearedCount);
      base.achievements=Array.isArray(d.achievements)?ACHIEVEMENTS.map(a=>a[0]).filter(id=>d.achievements.includes(id)):[];
      base.unlocked=Array.isArray(d.unlocked)?[...new Set([...BASE,...d.unlocked.filter(id=>WORDS.some(w=>w.id===id))])]:BASE.slice();
      for(const w of WORDS)if(w.unlock&&base.totalScore>=w.unlock&&!base.unlocked.includes(w.id))base.unlocked.push(w.id);
      base.deck=Array.isArray(d.deck)?[...new Set(d.deck.filter(id=>base.unlocked.includes(id)))].slice(0,6):BASE.slice();
      for(const id of BASE)if(base.deck.length<6&&!base.deck.includes(id))base.deck.push(id);
      if(base.deck.length>6)base.deck=base.deck.slice(0,6);return base;
    }
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(_){toast('保存できませんでした。端末の空き容量を確認してください','') }refreshStats()}
    function refreshStats(){ $('best').textContent=data.highScore.toLocaleString();$('wordCount').textContent=data.unlocked.length+'/12'; }
    const wordById=id=>WORDS.find(w=>w.id===id)||WORDS[0];
    function rand(){return Math.floor(Math.random()*data.deck.length)}
    function makeTile(v,i,extra=''){const d=document.createElement('div');d.className='tile '+extra;d.dataset.i=i;d.setAttribute('role','gridcell');const w=wordById(data.deck[v]);if(w.image){const im=document.createElement('img');im.src=w.image;im.alt=w.name;im.draggable=false;im.style.cssText='width:72%;height:72%;object-fit:contain';d.append(im)}else d.textContent=w.emoji;return d}
    function render(extra=new Set()){board.replaceChildren();cells.forEach((v,i)=>board.append(makeTile(v,i,extra.has(i)?'drop-in':'')));drawLinks()}
    const adjacent=WordChainLogic.adjacent;
    function hasMove(arr=cells){return WordChainLogic.hasMove(arr,N)}
    function shuffleEnsure(){for(let tries=0;tries<300;tries++){for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}if(hasMove())return}cells[0]=0;cells[1]=0;cells[2]=0}
    function newBoard(){cells=Array.from({length:N*N},rand);if(!hasMove())shuffleEnsure();render()}
    function cellCenter(i){const t=board.querySelector('[data-i="'+i+'"]');if(!t)return null;const b=board.getBoundingClientRect(),r=t.getBoundingClientRect();return{x:r.left-b.left+r.width/2,y:r.top-b.top+r.height/2}}
    function drawLinks(){const poly=$('links').querySelector('polyline');$('links').setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);const pts=path.map(cellCenter).filter(Boolean).map(p=>p.x+','+p.y).join(' ');poly.setAttribute('points',pts)}
    function select(i){if(!playing||busy||i<0||i>=cells.length)return;if(!active){active=true;path=[i];playTone('select')}else{const last=path[path.length-1];if(path.length>1&&i===path[path.length-2])path.pop();else if(!path.includes(i)&&adjacent(last,i)&&cells[last]===cells[i])path.push(i)}render()}
    function atPoint(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.tile')}
    function down(e){const tile=e.target.closest('.tile');if(!tile||!playing||busy)return;e.preventDefault();board.setPointerCapture?.(e.pointerId);select(Number(tile.dataset.i))}
    function move(e){if(!active)return;e.preventDefault();const tile=atPoint(e);if(tile)select(Number(tile.dataset.i))}
    const scoreMultiplier=WordChainLogic.multiplier;
    function fmt(n){return Math.floor(n).toLocaleString()}
    function refreshVoices(){if('speechSynthesis'in window)voices=window.speechSynthesis.getVoices()||[]}
    function say(word,onDone){const status=$('hint');if(!('speechSynthesis'in window)){status.textContent=word.name+'!';onDone?.();return}try{const s=window.speechSynthesis;refreshVoices();const u=new SpeechSynthesisUtterance(word.pron.toLowerCase());u.lang='en-US';u.rate=.84;u.volume=1;const en=voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(en)u.voice=en;u.onstart=()=>{status.textContent='Listen: '+word.name};u.onend=()=>{status.textContent=word.name+'!';onDone?.()};u.onerror=()=>{status.textContent=word.name+'!';onDone?.()};s.speak(u)}catch(_){status.textContent=word.name+'!';onDone?.()}}
    function primeSpeech(){if(!('speechSynthesis'in window))return;try{refreshVoices();say({name:'GO',pron:'go'})}catch(_){}}
    function getAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(_){return null}}
    function playTone(kind){if(!soundOn)return;const c=getAudio();if(!c)return;const now=c.currentTime;const notes=kind==='fever'?[523,659,784,1047]:kind==='clear'?[660,880]:kind==='select'?[480]:[740];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==='fever'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(kind==='select'?.035:.06,now+i*.07+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.14);o.connect(g).connect(c.destination);o.start(now+i*.07);o.stop(now+i*.07+.15)})}
    function toast(message,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=message;$('toasts').append(t);setTimeout(()=>t.remove(),3900)}
    function award(id){if(data.achievements.includes(id))return;data.achievements.push(id);const a=ACHIEVEMENTS.find(x=>x[0]===id);if(a)toast('🏅 実績解除：'+a[1],'achievement');save()}
    function unlockWords(){for(const w of WORDS){if(w.unlock&&data.totalScore>=w.unlock&&!data.unlocked.includes(w.id)){data.unlocked.push(w.id);toast('✨ 新しいことばを解放：'+w.emoji+' '+w.name,'unlock')}}}
    function updateFeverUI(){const fever=feverUntil>Date.now();$('feverTitle').classList.toggle('hot',fever);$('feverTitle').textContent=fever?'🔥 FEVER!':'✨ FEVER CHARGE';$('feverCount').textContent=fever?((Math.max(0,feverUntil-Date.now())/1000).toFixed(1)+' 秒'):feverProgress+' / 30';$('feverFill').style.width=fever?Math.max(0,Math.min(100,(feverUntil-Date.now())/10000*100))+'%':(feverProgress/30*100)+'%';document.body.classList.toggle('fevery',fever)}
    function activateFever(){feverProgress=0;feverUntil=Date.now()+10000;award('firstFever');updateFeverUI();const f=document.createElement('div');f.className='fever-flash';document.body.append(f);setTimeout(()=>f.remove(),600);toast('🔥 FEVER TIME! 10秒間スコア2倍','unlock')}
    function showFloat(amount){const f=document.createElement('div');f.className='float-score';f.textContent='+'+fmt(amount);document.querySelector('.board-wrap').append(f);setTimeout(()=>f.remove(),900)}
    function scoreUpdate(n){$('score').textContent=fmt(n);if(score>data.highScore){data.highScore=score;$('best').textContent=fmt(score)}}
    function finish(){if(!active)return;active=false;const selected=path.slice();path=[];if(selected.length<3){render();return}busy=true;const type=cells[selected[0]],len=selected.length,word=wordById(data.deck[type]),mult=scoreMultiplier(len),isFever=feverUntil>Date.now(),points=WordChainLogic.score(len,isFever);bestChain=Math.max(bestChain,len);score+=points;data.totalScore+=points;data.totalCleared+=len;scoreUpdate();$('word').textContent=word.name;$('hint').textContent=len+' CHAIN × '+mult+(isFever?' × FEVER':'');$('combo').textContent=len>=10?'AMAZING!':len>=7?'GREAT!':len>=5?'NICE!':len+' CHAIN';$('combo').classList.toggle('show',len>=5);showFloat(points);if(len>=8)award('chain8');if(score>=5000)award('score5000');unlockWords();const feverWas=isFever;let feverStarted=false;if(!feverWas){feverProgress+=len;if(feverProgress>=30){activateFever();feverStarted=true}}save();
      for(const i of selected){const t=board.querySelector('[data-i="'+i+'"]');t?.classList.add('clearing')}
      say(word,()=>playTone(feverStarted?'fever':'clear'));
      setTimeout(()=>{const removed=new Set(selected);for(let x=0;x<N;x++){const col=[];for(let y=N-1;y>=0;y--){const i=y*N+x;if(!removed.has(i))col.push(cells[i])}while(col.length<N)col.push(rand());for(let y=N-1;y>=0;y--)cells[y*N+x]=col[N-1-y]}shuffleEnsure();render(new Set(cells.map((_,i)=>i)));updateFeverUI();busy=false},160)
    }
    function tick(){const now=Date.now();remaining=Math.max(0,Math.ceil((gameEnds-now)/1000));$('time').textContent=remaining;updateFeverUI();if(now>=gameEnds)endGame()}
    function start(){primeSpeech();score=0;bestChain=0;remaining=60;feverProgress=0;feverUntil=0;playing=true;busy=false;active=false;path=[];gameEnds=Date.now()+60000;$('score').textContent='0';$('time').textContent='60';$('word').textContent='GO!';$('hint').textContent='同じ絵を3個以上つなげよう';$('combo').classList.remove('show');$('playBtn').textContent='⏹ END';updateFeverUI();newBoard();overlay.classList.add('hidden');data.plays++;award('firstPlay');if(data.plays>=10)award('plays10');save();clearInterval(tickHandle);tickHandle=setInterval(tick,100);}
    function endGame(){if(!playing)return;playing=false;busy=false;active=false;path=[];feverUntil=0;pauseStartedAt=null;$('playBtn').textContent='▶ PLAY';clearInterval(tickHandle);tickHandle=null;if(score>=5000)award('score5000');if(data.totalScore>=50000)award('total50000');save();updateFeverUI();showModal({title:'TIME UP!',body:'<div class="big">'+fmt(score)+'</div><p>SCORE<br>BEST CHAIN：'+bestChain+'<br>累計 '+fmt(data.totalScore)+' 点</p>',primary:'▶ AGAIN!',secondary:'📖 ことば・編成',action:start});}
    function closeModal(){overlay.classList.add('hidden');if(playing&&pauseStartedAt!==null){const pausedFor=Date.now()-pauseStartedAt;gameEnds+=pausedFor;if(feverUntil)feverUntil+=pausedFor;pauseStartedAt=null;tickHandle=setInterval(tick,100);tick()}}
    function showModal({title,body,primary='OK',secondary='',action=null,secondaryAction=showWords}){if(playing&&pauseStartedAt===null){pauseStartedAt=Date.now();clearInterval(tickHandle);tickHandle=null}$('modalTitle').textContent=title;$('modalText').innerHTML=body;$('modalPrimary').textContent=primary;$('modalPrimary').onclick=()=>{if(action)action();else closeModal()};$('modalSecondary').textContent=secondary;$('modalSecondary').classList.toggle('hidden',!secondary);$('modalSecondary').onclick=()=>secondaryAction();overlay.classList.remove('hidden')}
    function showWords(){const unlocked=data.unlocked.map(wordById);const next=WORDS.find(w=>w.unlock&&!data.unlocked.includes(w.id));const progress=next?Math.min(data.totalScore,next.unlock):data.totalScore;const needed=next?next.unlock:50000;const ratio=next?Math.min(100,progress/needed*100):100;const cards=WORDS.map(w=>{const ok=data.unlocked.includes(w.id),checked=data.deck.includes(w.id);return '<label class="word-option '+(ok?'':'locked')+'"><input type="checkbox" value="'+w.id+'" '+(ok?'':'disabled ') +(checked?'checked':'')+'><span class="emoji">'+w.emoji+'</span><span class="name">'+w.name+'<small>'+(ok?'編成を選択':fmt(w.unlock)+'点で解放')+'</small></span></label>'}).join('');
      showModal({title:'📖 ことば図鑑',body:'<p class="progress-copy">解放済み '+unlocked.length+' / 12　｜　累計 '+fmt(data.totalScore)+' 点</p><div class="meter"><div class="meter-fill" style="width:'+ratio+'%"></div></div><p class="progress-copy">'+(next?'次の解放：'+next.emoji+' '+next.name+'　'+fmt(data.totalScore)+' / '+fmt(next.unlock):'すべてのことばを解放！')+'</p><div class="collection-title">盤面に出すことばを6種類選ぶ</div><div class="grid-words">'+cards+'</div>',primary:'保存して閉じる',secondary:'戻る',action:()=>{const chosen=[...document.querySelectorAll('.word-option input:checked')].map(e=>e.value);if(chosen.length!==6){toast('盤面に出すことばを6種類選んでください');return}data.deck=chosen;save();closeModal();newBoard()},secondaryAction:()=>{if(playing)closeModal();else showHome()}});
    }
    function showAchievements(){const html='<p class="progress-copy">解除 '+data.achievements.length+' / '+ACHIEVEMENTS.length+'</p><div class="ach-list">'+ACHIEVEMENTS.map(a=>'<div class="ach '+(data.achievements.includes(a[0])?'unlocked':'')+'"><span>'+a[1]+'<br><small>'+a[2]+'</small></span><b>'+(data.achievements.includes(a[0])?'✓':'🔒')+'</b></div>').join('')+'</div>';
      showModal({title:'🏅 実績',body:html,primary:'閉じる',secondary:'📖 ことば',action:closeModal,secondaryAction:showWords})}
    function showHome(){showModal({title:'🐾 WORD CHAIN β1',body:'同じ絵を3つ以上つなげて消そう！<br>60秒でスコアを伸ばし、英単語を解放しよう。<p class="muted">ドラッグしてつなぐだけ。発音もいっしょに聞いてみよう！</p>',primary:'▶ PLAY!',secondary:'📖 ことば・編成',action:start,secondaryAction:showWords})}
    $('playBtn').addEventListener('click',()=>playing?endGame():start());$('wordsBtn').addEventListener('click',showWords);$('achBtn').addEventListener('click',showAchievements);$('helpBtn').addEventListener('click',()=>showModal({title:'あそびかた',body:'<p>同じ絵文字を上下左右・斜めにつないで、3個以上で消去！</p><p>長くつなぐほど高得点。30個消すと10秒間のフィーバーが発動します。</p><p>時間がなくなる前に、たくさん消して新しいことばを解放しよう。</p>',primary:'ゲームへ戻る',secondary:'📖 ことば図鑑',action:closeModal,secondaryAction:showWords}));
    $('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊':'🔇';if(soundOn)playTone('select')});$('voiceTest').addEventListener('click',()=>say(wordById(data.deck[0])));if('speechSynthesis'in window){refreshVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices)}board.addEventListener('pointerdown',down);board.addEventListener('pointermove',move);window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);window.addEventListener('resize',drawLinks);document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)finish()});
    document.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel()});
    if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    refreshStats();newBoard();updateFeverUI();showHome();
  })();
  </script>
</body>
</html>
